name: Deploy portfolio to GitHub Pages

on:
  push:
    branches:
      - main
  # Without this the quality gate only ran after a merge, so a broken change was
  # found on main rather than on the pull request that introduced it.
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Scoped per ref so a pull-request run cannot cancel an in-flight deploy of main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Verify site quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify site
        run: npm run verify

  build:
    name: Build Pages artifact
    needs: quality
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build with Astro
        uses: withastro/action@v6
        with:
          node-version: 24

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v5
